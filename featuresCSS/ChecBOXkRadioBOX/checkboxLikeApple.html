<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<style>
		*,*::after,*::before {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html {
			font-size: 18px;
		}
		body {
			transition: 0.25s linear background;
		}
		.wrapper {
			max-width: 400px;
			margin: 100px auto;
			padding: 20px;
			background-color: whitesmoke;
			height: 200px;
			display: flex;
			align-items: center;
			justify-content: center;
			flex-direction: column;
			transition: 0.25s linear background;
		}

		.label {
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.checkboxLikeApple {
			appearance: none;
			min-height: 1.65rem;
  		min-width: 2.75rem;
			border-radius: 2rem;
			background: lightgrey;
			box-shadow: 1px 2px 3px #0003 inset;
			margin-right: 10px;
			transition: 0.25s linear background;
			position: relative;
		}	
		.checkboxLikeApple::before {
			content: '';
			width: 1.33rem;
			height: 1.3rem;
			background: #fff;
			border-radius: 1.2rem;
			position: absolute;
			top: 0.175rem;
			left: 0.2rem;
			box-shadow: 0px 1px 3px #0003;
			transition: 0.25s linear transform;
			transform: translateX(0rem);
		}
		.checkboxLikeApple:checked {
			background: rgb(5, 99, 240);
		}
		.checkboxLikeApple:checked::before {
			transform: translateX(1rem);
		}
		.checkboxLikeApple:focus-visible {
			outline: 2px solid rgb(5, 99, 240);
			outline-offset: 2px;
		}

		.wrapper:has(.checkboxLikeApple:checked) {
			background-color: #404040;
		}		
		body:has(.checkboxLikeApple:checked) {
			background-color: #262626;
			color: whitesmoke;
		}
		/* .checkboxLikeApple:checked body {
			background-color: black;
		} */

		label {
			font-size: 2rem;
		}
	</style>
</head>
<body>

	<div class="wrapper">
			<label for="checkbox" class="label">
				<input type="checkbox" name="" id="checkbox" class="checkboxLikeApple">
				Lorem ipsum dolor sit amet consectetur.
			</label>		
	</div>

	<script>

	</script>
</body>
</html>
