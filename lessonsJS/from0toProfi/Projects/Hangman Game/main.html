<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Hangman Game</title>
	<link rel="stylesheet" href="style.css"/>
</head>
<body>
	<main>

		<section class="start_screen">	
			<h1>Han<span>g</span>man</h1>
			<div class="wrapper_input">
				<input id="input" type="text" class="input">
			</div>
			<button class="start_button" onclick="startGame()">Start Game</button>
		</section>

		<section class="game_screen display_none">
			<h2>Guess the letters</h2>
			<section class="wrapper_output"></section>
			<div class="wrapper">
				<section class="lifes">
					<div class="life"></div>
					<div class="life"></div>
					<div class="life"></div>
					<div class="life"></div>
					<div class="life"></div>
					<div class="life"></div>
				</section>
				<div style="position: absolute; left: 50%;">
					<button class="restart_button" onclick="restartGame()">Restart</button>
				</div>
			</div>
		</section>

	</main>
	<script src="script.js"></script>
</body>
</html>
