<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="/css/style.css">
	<title>Forms</title>
</head>
<body>
	<section class="wrapper">
			<form action="#" class="form" name="mainForm">
				<h1 class="header" tabindex="-1">Опросник</h1>
			<div class="item-wrapper">
				<label for="formFIO" class="formLabel">ФИО:</label>
				<input type="text" id="formFIO" class="formInput" name="FIO" placeholder="First name Second name {Third name}">
			</div>
			<div class="item-wrapper">
				<div class="sex-title">Пол:</div>
				<div class="radio-wrapper">
					<input type="radio" checked value="Male" id="formMale" class="formRadio" name="Sex">
					<label for="formMale" class="formRadioLabel">Мужской</label>
				</div>
				<div class="radio-wrapper">	
					<input type="radio" value="Famale" id="formFamale" class="formRadio" name="Sex">
					<label for="formFamale" class="formRadioLabel">Женский</label>
				</div>
			</div>
			<div class="item-wrapper">
				<label for="formAdress" class="formLabel">Адрес:</label>
				<input type="textarea" id="formAdress" class="formInput" name="Adress" placeholder="Some adress...">
			</div>
			<div class="item-wrapper">
				<label for="formEmail" class="formLabel">E-mail:</label>
				<input type="text" id="formEmail" class="formInput" name="Email" placeholder="username@domain.name">
			</div>
			<div class="item-wrapper">
				<label for="formTel" class="formLabel">Телефон:</label>
				<input type="text" id="formTel" class="formInput" name="Tel" placeholder="+375(29) XXX-XX-XX">
			</div>
			<div class="item-wrapper">
				<div class="question-title">Вопрос 1</div>
				<div class="radio-wrapper">
					<input type="radio" checked value="answer1" id="answer1_1" class="formRadio" name="answerBlock1">
					<label for="answer1_1" class="formRadioLabel">Ответ 1</label>
				</div>
				<div class="radio-wrapper">
					<input type="radio" value="answer2" id="answer1_2" class="formRadio" name="answerBlock1">
					<label for="answer1_2" class="formRadioLabel">Ответ 2</label>
				</div>
				<div class="radio-wrapper">
					<input type="radio" value="answer3" id="answer1_3" class="formRadio" name="answerBlock1">
					<label for="answer1_3" class="formRadioLabel">Ответ 3</label>
				</div>
				<div class="radio-wrapper">
					<input type="radio" value="answer4" id="answer1_4" class="formRadio" name="answerBlock1">
					<label for="answer1_4" class="formRadioLabel">Ответ 4</label>
				</div>
			</div>
			<div class="item-wrapper">
				<div class="question-title">Вопрос 2</div>
				<div class="checkbox-wrapper">
					<input type="checkbox" value="answer1" id="answer2_1" class="formCheckbox" name="answerBlock2">
					<label for="answer2_1" class="formCheckboxLabel">Ответ 1</label>
				</div>
				<div class="checkbox-wrapper">
					<input type="checkbox" value="answer2" id="answer2_2" class="formCheckbox" name="answerBlock2">
					<label for="answer2_2" class="formCheckboxLabel">Ответ 2</label>
				</div>
				<div class="checkbox-wrapper">
					<input type="checkbox" value="answer3" id="answer2_3" class="formCheckbox" name="answerBlock2">
					<label for="answer2_3" class="formCheckboxLabel">Ответ 3</label>
				</div>
				<div class="checkbox-wrapper">
					<input type="checkbox" value="answer4" id="answer2_4" class="formCheckbox" name="answerBlock2">
					<label for="answer2_4" class="formCheckboxLabel">Ответ 4</label>
				</div>
			</div>
			<div class="item-wrapper">
				<label for="formComment" class="formLabel">Коментарий</label>
				<textarea type="textarea" id="formComment" class="formInput" name="Comment" placeholder="Some comments..."></textarea>
			</div>
			<div class="item-wrapper">
				<div class="select">Выбор</div>
				<select id="formSelect" class="formSelect" name="select">
					<option value="select1" selected>Выбор 1</option>
					<option value="select2">Выбор 2</option>
					<option value="select3">Выбор 3</option>
					<option value="select4">Выбор 4</option>
				</select>
			</div>
			<div class="item-wrapper centerItem">
				<input type="submit" value="Отправить" class="btn">
				<input type="reset" value="Сбросить" class="btn">
			</div>
		</form>
	</section>

	<script src="/js/script.js"></script>
</body>
</html>
