<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rich Text Editor</title>
    <!-- FontAwesome Icons -->
		<link 
			rel="stylesheet" 
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">

			<div id="text-input" contenteditable="true"></div>

      <div class="options">

				<!-- Format -->
				<section class="option_section format-section">
					<button id="bold" class="format_btns">
						<i class="fa fa-bold"></i>
					</button>				
					<button id="italic" class="format_btns">
						<i class="fa fa-italic"></i>
					</button>
					<button id="underline" class="format_btns">
						<i class="fa fa-underline"></i>
					</button>
					<button id="strikethrough" class="format_btns">
						<i class="fa fa-strikethrough"></i>
					</button>
				</section>

				<!-- List -->
				<section class="option_section list-section">
					<button id="ul" class="list_btns">
						<i class="fa fa-list-ul"></i>
					</button>
					<button id="ol" class="list_btns">
						<i class="fa fa-list-ol"></i>
					</button>
					<button id="check" class="list_btns">
						<i class="fa fa-list-check"></i>
					</button>
				</section>
        
				<!-- Undo/Redo -->
				<section class="option_section do-section">
					<button id="undo" class="do_btns">
						<i class="fa fa-arrow-rotate-left"></i>
					</button>
					<button id="redo" class="do_btns">
						<i class="fa fa-arrow-rotate-right"></i>
					</button>
				</section>

				<!-- Rest -->
				<section class="option_section rest-section">
					<button id="link" class="rest_btns">
						<i class="fa fa-link"></i>
					</button>
					<button id="header" class="rest_btns">
						<i class="fa fa-header"></i>
					</button>
				</section>

				<!-- Colors -->
				<section class="option_section color-section">
					<div class="color-input">
						<input type="color" id="font-color">
						<label for="font-color">Font</label>
					</div>					
					<div class="color-input">
						<input type="color" id="highlight-color">
						<label for="font-color">Highlight</label>
					</div>
				</section>


			</div>
		</div>

    <script src="script.js"></script>
  </body>
</html>
