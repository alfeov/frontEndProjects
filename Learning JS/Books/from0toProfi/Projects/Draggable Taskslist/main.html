<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<div>
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@300;400;600&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
	</div> <!--Ссылки на шришты-->

	<title>Draggable Tasklist</title>
	<link rel="stylesheet" href="style.css"/>
</head>
<body>
	<section class="wrapper-form">
		<h2 class="visually-hidden"></h2>
		<form action="#" class="form" id="form">
			<p class="form-head">Оставить заявку</p>
			<div class="mail">
				<label for="formEmail">E-Mail</label>
				<input id="formEmail" type="text" name="email" class="forminput _email _req">
			</div>
			<div class="checkbox">
				<input type="checkbox" id="checkbox" class="checkbox-box">
				<label for="checkbox">Хочу знать о новых проектах</label>
			</div>
			<div class="send-conteiner">
				<button type="submit" class="send">Отправить</button>
			</div>
		</form>
	</section>
	<script src="script.js"></script>
</body>
</html>
